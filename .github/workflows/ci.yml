name: CI

on:
  push:
    paths:
      - 'src/BKE.Desktop.Client/**'
      - 'src/BKE.Desktop.Licensing/**'
      - 'tests/BKE.Desktop.Client.Tests/**'
      - 'tests/BKE.Desktop.Licensing.Tests/**'
      - 'BKE.Desktop.SDK.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/BKE.Desktop.Client/**'
      - 'src/BKE.Desktop.Licensing/**'
      - 'tests/BKE.Desktop.Client.Tests/**'
      - 'tests/BKE.Desktop.Licensing.Tests/**'
      - 'BKE.Desktop.SDK.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LICENSING_PROJECT: src/BKE.Desktop.Licensing/BKE.Desktop.Licensing.csproj
      LEGACY_TEST_PROJECT: tests/BKE.Desktop.Client.Tests/BKE.Desktop.Client.Tests.csproj
      LICENSING_TEST_PROJECT: tests/BKE.Desktop.Licensing.Tests/BKE.Desktop.Licensing.Tests.csproj
      PACKAGE_PATH: artifacts/BKE.Desktop.Licensing.2.0.1.nupkg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify .NET 10 SDK selection
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          sdk_version="$(dotnet --version)"
          case "$sdk_version" in
            10.0.*) ;;
            *)
              echo "::error::Expected .NET SDK 10.0.x, selected $sdk_version"
              exit 1
              ;;
          esac

      - name: Restore complete SDK family solution
        run: dotnet restore BKE.Desktop.SDK.sln

      - name: Build solution
        run: dotnet build BKE.Desktop.SDK.sln --configuration Release --no-restore

      - name: Verify Release assembly outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f src/BKE.Desktop.Client/bin/Release/net10.0/BKE.Desktop.Client.dll
          test -f src/BKE.Desktop.Licensing/bin/Release/net10.0/BKE.Desktop.Licensing.dll
          test -f tests/BKE.Desktop.Client.Tests/bin/Release/net10.0/BKE.Desktop.Client.Tests.dll
          test -f tests/BKE.Desktop.Licensing.Tests/bin/Release/net10.0/BKE.Desktop.Licensing.Tests.dll

      - name: Run legacy compatibility tests
        run: |
          mkdir -p test-results/legacy
          dotnet test "$LEGACY_TEST_PROJECT" --configuration Release --no-build --results-directory test-results/legacy --logger "trx;LogFileName=legacy.trx"

      - name: Run licensing capability tests
        run: |
          mkdir -p test-results/licensing
          dotnet test "$LICENSING_TEST_PROJECT" --configuration Release --no-build --results-directory test-results/licensing --logger "trx;LogFileName=licensing.trx"

      - name: Assert both test suites executed
        shell: bash
        run: |
          set -euo pipefail
          test -s test-results/legacy/legacy.trx
          test -s test-results/licensing/licensing.trx
          grep -q '<UnitTestResult' test-results/legacy/legacy.trx
          grep -q '<UnitTestResult' test-results/licensing/licensing.trx

      - name: Pack hardened licensing capability
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          dotnet pack "$LICENSING_PROJECT" --configuration Release --no-build --output artifacts

      - name: Verify package contents and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE_PATH"
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.nupkg' -print)
          test "${#packages[@]}" -eq 1

          unzip -Z1 "$PACKAGE_PATH" | grep -Fx 'README.md'
          unzip -Z1 "$PACKAGE_PATH" | grep -Fx 'LICENSE-BKE-PROPRIETARY.txt'
          unzip -Z1 "$PACKAGE_PATH" | grep -Fx 'lib/net10.0/BKE.Desktop.Licensing.dll'
          unzip -Z1 "$PACKAGE_PATH" | grep -Fx 'BKE.Desktop.Licensing.nuspec'

          unzip -p "$PACKAGE_PATH" BKE.Desktop.Licensing.nuspec > package.nuspec
          grep -q '<id>BKE.Desktop.Licensing</id>' package.nuspec
          grep -q '<version>2.0.1</version>' package.nuspec
          grep -q '<readme>README.md</readme>' package.nuspec
          grep -q '<license type="file">LICENSE-BKE-PROPRIETARY.txt</license>' package.nuspec

      - name: Verify package boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.cs' --fixed-strings 'BKE.Desktop.Client' src/BKE.Desktop.Licensing tests/BKE.Desktop.Licensing.Tests; then
            echo '::error::BKE.Desktop.Licensing source must not use the legacy BKE.Desktop.Client namespace.'
            exit 1
          fi
          if grep -R --line-number --include='*.csproj' -E '(<PackageReference[^>]+BKE\.Desktop\.Client|<ProjectReference[^>]+BKE\.Desktop\.Client)' src/BKE.Desktop.Licensing tests/BKE.Desktop.Licensing.Tests; then
            echo '::error::BKE.Desktop.Licensing must not reference the legacy BKE.Desktop.Client package/project.'
            exit 1
          fi
          grep -q 'ActivationInteraction.NativeDesktop' src/BKE.Desktop.Licensing/BkeLicensingClient.cs
          grep -q 'activation_interaction_not_supported:system_browser' src/BKE.Desktop.Licensing/BkeLicensingClient.cs
          grep -q 'activation_interaction_not_supported:command_line' src/BKE.Desktop.Licensing/BkeLicensingClient.cs

      - name: Upload licensing package and test evidence
        uses: actions/upload-artifact@v7
        with:
          name: BKE.Desktop.Licensing-2.0.1
          path: |
            artifacts/BKE.Desktop.Licensing.2.0.1.nupkg
            test-results/legacy/legacy.trx
            test-results/licensing/licensing.trx
          if-no-files-found: error

# .NET 10 migration exact-head certification trigger
