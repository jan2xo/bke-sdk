name: BKE.RateLimiting

on:
  push:
    paths:
      - 'src/BKE.RateLimiting/**'
      - 'tests/BKE.RateLimiting.Tests/**'
      - 'benchmarks/BKE.RateLimiting.Benchmarks/**'
      - 'docs/sdk/BKE.RateLimiting*'
      - 'scripts/certify-rate-limiting-package.py'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/rate-limiting.yml'
  pull_request:
    paths:
      - 'src/BKE.RateLimiting/**'
      - 'tests/BKE.RateLimiting.Tests/**'
      - 'benchmarks/BKE.RateLimiting.Benchmarks/**'
      - 'docs/sdk/BKE.RateLimiting*'
      - 'scripts/certify-rate-limiting-package.py'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/rate-limiting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Record runner and SDK identity
        run: |
          dotnet --info
          git rev-parse HEAD
          uname -a
          lscpu
      - name: Restore rate-limiting tests and SDK
        run: dotnet restore tests/BKE.RateLimiting.Tests/BKE.RateLimiting.Tests.csproj
      - name: Release build with warnings as errors
        run: dotnet build tests/BKE.RateLimiting.Tests/BKE.RateLimiting.Tests.csproj --configuration Release --no-restore -warnaserror
      - name: Rate-limiting boundary and invariant certification
        run: dotnet test tests/BKE.RateLimiting.Tests/BKE.RateLimiting.Tests.csproj --configuration Release --no-build --no-restore --results-directory artifacts/test-results --logger "trx;LogFileName=rate-limiting.trx" --logger "console;verbosity=normal"
      - name: Create package
        run: dotnet pack src/BKE.RateLimiting/BKE.RateLimiting.csproj --configuration Release --no-build --no-restore --output artifacts/packages
      - name: Inspect package and execute blank consumer
        run: python3 scripts/certify-rate-limiting-package.py artifacts/packages/BKE.RateLimiting.0.1.0.nupkg artifacts/package-certification
      - name: Build benchmark harness
        run: dotnet build benchmarks/BKE.RateLimiting.Benchmarks/BKE.RateLimiting.Benchmarks.csproj --configuration Release -warnaserror
      - name: Characterize performance and partition memory
        run: dotnet run --project benchmarks/BKE.RateLimiting.Benchmarks/BKE.RateLimiting.Benchmarks.csproj --configuration Release --no-build -- --output=artifacts/benchmarks
      - name: Upload package and certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BKE.RateLimiting-0.1.0-certification
          path: artifacts/
          if-no-files-found: error
